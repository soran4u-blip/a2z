# a2z.deals: public site + short links, admin on its own hostname.
# Certbot adds the 443 blocks and the http->https redirect.
limit_req_zone $binary_remote_addr zone=a2z_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name a2z.deals www.a2z.deals;
    client_max_body_size 200k;

    location /api/ {
        limit_req zone=a2z_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/a2z-proxy.inc;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/a2z-proxy.inc;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.a2z.deals;
    client_max_body_size 200k;

    location / {
        limit_req zone=a2z_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/a2z-proxy.inc;
    }
}
