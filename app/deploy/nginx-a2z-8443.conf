# Temporary: serve a2z.deals + admin.a2z.deals on 8443 (picked by SNI, existing sites on 8443 are unchanged).
# Switch to 443 once ports 80/443 are forwarded.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name a2z.deals admin.a2z.deals;

    ssl_certificate     /etc/letsencrypt/live/a2z.deals/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a2z.deals/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200k;

    location /api/ {
        limit_req zone=a2z_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/a2z-proxy.inc;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/a2z-proxy.inc;
    }
}
